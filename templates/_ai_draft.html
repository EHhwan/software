{# '✨ 한 줄로 번개 만들기' - new.html 의 작성 폼 바로 위에서 {% include "_ai_draft.html" %} 로 넣는다.
   AI가 채운 값은 폼에 들어가기만 하고, 등록은 사용자가 확인한 뒤 [번개 올리기] 버튼으로 한다. #}
<section id="ai-draft" class="mb-5 rounded-3xl bg-violet-50 border-2 border-violet-100 p-5">
  <label for="ai-text" class="block text-sm font-extrabold text-violet-700">✨ 한 줄로 번개 만들기 (AI)</label>
  <p class="mt-1 text-xs font-semibold text-violet-500">말하듯 적으면 AI가 아래 폼을 채워 줘요. 채워진 내용을 확인한 뒤 올리세요.</p>
  <div class="mt-3 flex flex-col gap-2 sm:flex-row">
    <textarea id="ai-text" rows="2" maxlength="200"
              class="w-full flex-1 resize-none rounded-2xl bg-white border-2 border-transparent focus:border-violet-400 outline-none px-4 py-3 text-sm font-semibold"
              placeholder="예) 내일 수업 끝나고 6시쯤 체육관에서 배드민턴 칠 사람 3명, 1시간 반 정도"></textarea>
    <button type="button" id="ai-btn"
            class="shrink-0 rounded-2xl bg-violet-500 text-white font-bold px-4 py-3 hover:bg-violet-600 active:scale-95 transition disabled:cursor-wait disabled:opacity-60">
      AI로 채우기
    </button>
  </div>
  <p id="ai-msg" class="mt-2 hidden text-sm font-semibold" role="status" aria-live="polite"></p>
</section>

<script>
(() => {
  const CSRF = "{{ csrf_token() }}";
  const LABELS = {title: "제목", category: "카테고리", meet_time: "시간", max_people: "인원", location: "장소"};
  const box = document.getElementById("ai-text");
  const btn = document.getElementById("ai-btn");
  const msg = document.getElementById("ai-msg");

  function show(text, kind) {
    msg.textContent = text;
    msg.className = "mt-2 text-sm " + (kind === "error" ? "text-rose-600" : "text-violet-700");
  }

  // name 으로 폼 칸을 찾아 값을 넣는다. 라디오·select·일반 입력 모두 처리하고,
  // input/change 이벤트를 보내서 기존 화면 로직(셔틀 실시간 안내 등)이 그대로 반응하게 한다.
  function fill(name, value) {
    if (value === null || value === undefined || value === "") return false;
    const els = document.querySelectorAll(`[name="${name}"]`);
    if (!els.length) return false;
    let target = null;
    els.forEach(el => {
      if (el.type === "radio" || el.type === "checkbox") {
        if (el.value === String(value)) { el.checked = true; target = el; }
      } else {
        el.value = value;
        target = el;
      }
    });
    if (!target) return false;
    target.dispatchEvent(new Event("input", {bubbles: true}));
    target.dispatchEvent(new Event("change", {bubbles: true}));
    // 카테고리 라디오는 sr-only 로 숨겨져 있으므로 옆의 알약 모양 span 을 강조한다
    const mark = target.type === "radio" ? (target.nextElementSibling || target) : target;
    mark.classList.add("ring-2", "ring-violet-400");
    setTimeout(() => mark.classList.remove("ring-2", "ring-violet-400"), 2500);
    return true;
  }

  async function run() {
    const text = box.value.trim();
    if (text.length < 5) { show("5자 이상 적어 주세요.", "error"); return; }
    btn.disabled = true;
    btn.textContent = "AI가 읽는 중…";
    show("잠시만요, 문장을 분석하고 있어요.", "info");
    try {
      const body = new FormData();
      body.append("text", text);
      body.append("csrf_token", CSRF);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);  // 서버가 끝내 응답하지 않을 때
      const res = await fetch("{{ url_for('api_ai_draft') }}", {method: "POST", body, signal: ctrl.signal});
      clearTimeout(timer);
      if (!(res.headers.get("content-type") || "").includes("json")) {
        throw new Error("요청이 만료됐어요. 페이지를 새로고침한 뒤 다시 시도해 주세요.");
      }
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);

      const f = data.fields;
      ["title", "category", "meet_time", "duration", "max_people", "location", "description"]
        .forEach(k => fill(k, f[k]));
      // 장소를 채웠으면 기존 [📍 위치 찾기]를 눌러 지도 핀·좌표도 새 장소로 맞춘다
      const searchBtn = document.getElementById("btn-search");
      if (f.location && searchBtn) searchBtn.click();
      const missing = data.missing.map(k => LABELS[k]);
      show(missing.length
        ? `채웠어요! 문장에 없던 항목은 직접 입력해 주세요: ${missing.join(", ")}`
        : "채웠어요! 지도 핀과 내용을 확인하고 비밀번호를 정한 뒤 올리세요.", "info");
    } catch (e) {
      show(e.name === "AbortError" ? "AI 응답이 너무 늦어요. 아래 폼에 직접 입력해 주세요."
                                   : (e.message || "AI 연결에 실패했어요. 아래 폼에 직접 입력해 주세요."), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "AI로 채우기";
    }
  }

  btn.addEventListener("click", run);
  box.addEventListener("keydown", e => {  // 엔터로 실행 (Shift+엔터는 줄바꿈), 폼이 등록되지 않게 막는다
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); run(); }
  });
})();
</script>

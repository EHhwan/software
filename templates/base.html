<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}캠퍼스 핏{% endblock %} · campus fit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="font-sans min-h-screen text-slate-800 bg-gradient-to-br from-violet-100 via-pink-50 to-amber-50">

  <header class="sticky top-0 z-30 backdrop-blur bg-white/70 border-b border-white">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('index') }}" class="flex items-center gap-2">
        <span class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-500 to-pink-500 grid place-items-center text-xl shadow-lg shadow-violet-200">⚡</span>
        <span class="text-xl font-extrabold tracking-tight">
          캠퍼스 <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-500 to-pink-500">핏</span>
          <span class="hidden sm:inline text-xs font-semibold text-slate-400 ml-1">campus fit</span>
        </span>
      </a>
      <a href="{{ url_for('new_post') }}"
         class="rounded-full bg-gradient-to-r from-violet-500 to-pink-500 text-white font-bold px-5 py-2.5 shadow-lg shadow-pink-200 hover:scale-105 active:scale-95 transition">
        + 번개 만들기
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 rounded-2xl px-4 py-3 font-semibold shadow-sm
          {{ 'bg-emerald-100 text-emerald-800' if cat == 'ok' else 'bg-rose-100 text-rose-800' }}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-xs text-slate-400 pb-10">캠퍼스 핏 · 지금 바로 모이는 우리 학교 번개 ⚡</footer>
  {% block scripts %}{% endblock %}
</body>
</html>

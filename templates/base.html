<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SERVICE_NAME }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Pretendard', 'system-ui', 'sans-serif'] } } } }
  </script>
  {% block head %}{% endblock %}
</head>
<body class="font-sans min-h-screen bg-slate-50 text-slate-800">

  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{{ url_for('index') }}" class="text-xl font-extrabold tracking-tight">📢 {{ SERVICE_NAME }}</a>
      {# TODO: 메뉴 (내 프로필, 공지 추가 등) #}
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-4 rounded-xl px-4 py-3 font-semibold
          {{ 'bg-emerald-100 text-emerald-800' if cat == 'ok' else 'bg-rose-100 text-rose-800' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
